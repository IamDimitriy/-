name: Android app

on:
  push:
    paths:
      - "sleep-talk-recorder/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-talk-recorder/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic
        run: ./gradlew --no-daemon :core:test

      - name: Test the app (Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sleep-talk-recorder/android/core/build/reports/tests/
            sleep-talk-recorder/android/app/build/reports/tests/
            sleep-talk-recorder/android/app/build/test-results/

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Sonnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sonnik-apk
          path: sleep-talk-recorder/android/Sonnik.apk

      # A fixed "latest" release, so the phone always downloads the newest build from one link.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/sleep-talk-recorder-jh3yv1' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sonnik-latest --yes --cleanup-tag || true
          gh release create sonnik-latest Sonnik.apk \
            --target "$GITHUB_SHA" \
            --title "Сонник ${GITHUB_RUN_NUMBER}" \
            --notes "Сборка из ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Скачайте Sonnik.apk на телефон и установите."

  # Runs the app on an Android 14 emulator: records a prepared night and checks the automatic
  # start with the screen off. Screenshots and a video are uploaded as the "demo" artifact.
  demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sleep-talk-recorder/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Make the demo night
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng > /dev/null
          pip install -q numpy
          python3 demo/make_audio.py demo/night.wav

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run demo on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: sleep-talk-recorder/android
          script: bash demo/run-demo.sh

      - name: Upload demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: sleep-talk-recorder/android/demo-out/
